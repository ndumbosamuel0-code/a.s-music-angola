name: Build and quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint (excluding repository-wide Prettier formatting rule)
        run: bun run lint -- --rule 'prettier/prettier: off'
      - name: Unit tests
        run: bun run test --passWithNoTests
      - name: Production build
        run: bun run build
